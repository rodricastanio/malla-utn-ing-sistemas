name: build-apk

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Escribir variables de entorno
        run: |
          printf "VITE_SUPABASE_URL=%s\n" "$VITE_SUPABASE_URL" > .env
          printf "VITE_SUPABASE_ANON_KEY=%s\n" "$VITE_SUPABASE_ANON_KEY" >> .env
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Instalar dependencias
        run: npm ci

      - name: Build web
        run: npm run build

      - name: Deploy Live Update a Capgo
        if: env.CAPGO_TOKEN != ''
        run: npx @capgo/cli@latest bundle upload --channel production --bundle "1.0.${{ github.run_number }}" --comment "CI ${{ github.sha }}" --version-exists-ok --no-key
        env:
          CAPGO_TOKEN: ${{ secrets.CAPGO_TOKEN }}

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Keystore (firma release)
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            mkdir -p keystore
            echo "$KEYSTORE_BASE64" | base64 --decode > keystore/mallautn.keystore
            echo "KEYSTORE_PATH=keystore/mallautn.keystore" >> "$GITHUB_ENV"
          else
            echo "Sin secrets de firma: el APK release quedará sin firmar."
          fi
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Build APKs (debug + release)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ format('1.0.{0}', github.run_number) }}

      - name: Publicar APK en GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Plan Ing. Sistemas — APK instalable
          body: |
            APK firmado (release). Instalalo una vez; después las actualizaciones llegan solas por Capgo Live Update.

            - Versión: 1.0.${{ github.run_number }}
            - Commit: ${{ github.sha }}
          files: |
            android/app/build/outputs/apk/release/app-release.apk
          replace_existing: true
          update_latest_release: true
          fail_on_unmatched_files: true

      - uses: actions/upload-artifact@v5
        with:
          name: apk-android
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
